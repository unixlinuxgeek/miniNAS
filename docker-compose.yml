services:
  transmission:
    image: unixlinuxgeek/transmission
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/geek/transmission/downloads:/transmission/downloads

  minidlna:
    image: unixlinuxgeek/minidlna
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/geek/transmission/downloads:/transmission/downloads
      - /home/geek/miniNAS/minidlna/minidlna.conf:/etc/minidlna.conf

